<title id="ictsolutions-architecture-sk-title">Architektúra webu ictsolutions.net</title>
<desc id="ictsolutions-architecture-sk-desc">Kód je na GitHube, GitHub Actions zostaví image do GHCR a self-hosted runner ich nasadí na našu VM. Návštevník ide cez Traefik na statický web v nginx alebo na contact-api, ktoré overí Cloudflare Turnstile a vytvorí tiket vo FreeScoute. Na tej istej VM beží aj Umami.</desc>
